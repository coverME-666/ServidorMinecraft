version: '3.8'
services:
  frontend:
    build: ./app_web/frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
  backend:
    build: ./app_web/backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=development
